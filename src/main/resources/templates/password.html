<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('设置密码')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="wrap">
    <section class="card">
        <h1>设置密码</h1>
        <p class="sub" th:text="${rule}">规则</p>
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <form th:action="@{/password}" method="post">
            <label for="currentPassword">当前密码</label>
            <input id="currentPassword" name="currentPassword" type="password" required>
            <label for="newPassword">新密码</label>
            <input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="20" required>
            <label for="confirmPassword">确认新密码</label>
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="20" required>
            <div class="actions">
                <button class="btn" type="submit">保存密码</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
