<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('成员操作日志')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="wrap">
    <section class="card">
        <div class="page-head">
            <div>
                <h1>成员操作日志</h1>
                <p class="sub">该成员相关的启用/禁用、导入、个人权限等变更操作。</p>
            </div>
            <a class="btn ghost" th:href="@{/admin/members}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                返回
            </a>
        </div>
        <table>
            <thead>
            <tr><th>时间</th><th>操作人</th><th>操作</th><th>详情</th></tr>
            </thead>
            <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}">-</td>
                <td th:text="${log.operatorName}">-</td>
                <td th:text="${log.action}">-</td>
                <td th:text="${log.detail}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs)}"><td colspan="4" class="hint">暂无操作记录。</td></tr>
            </tbody>
        </table>
        <div th:replace="~{fragments/layout :: pagination}"></div>
    </section>
</main>
</body>
</html>
