<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('任务管理')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="wrap">
    <section class="card">
        <div class="page-head">
            <div>
                <h1>任务管理</h1>
                <p class="sub">管理全部任务，可按状态筛选。</p>
            </div>
            <a class="btn" th:href="@{/pm/tasks/new}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                新建任务
            </a>
        </div>
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="filter-bar">
            <a class="filter" th:classappend="${selected == '' && assignee == ''} ? 'active'" th:href="@{/pm/tasks}">全部</a>
            <a class="filter" th:classappend="${selected == 'TODO' && assignee == ''} ? 'active'" th:href="@{/pm/tasks(status=TODO)}">待处理</a>
            <a class="filter" th:classappend="${selected == 'IN_PROGRESS' && assignee == ''} ? 'active'" th:href="@{/pm/tasks(status=IN_PROGRESS)}">进行中</a>
            <a class="filter" th:classappend="${selected == 'DONE' && assignee == ''} ? 'active'" th:href="@{/pm/tasks(status=DONE)}">已完成</a>
            <a class="filter" th:classappend="${assignee == 'none'} ? 'active'" th:href="@{/pm/tasks(assignee=none)}">未分配</a>
        </div>
        <table>
            <thead>
            <tr>
                <th>任务</th>
                <th>负责人</th>
                <th>优先级</th>
                <th>截止日期</th>
                <th>状态</th>
                <th class="th-actions">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}">
                <td>
                    <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}" class="link">标题</a>
                </td>
                <td th:text="${task.assignee != null} ? ${task.assignee.name} : '未分配'">-</td>
                <td><span class="badge" th:classappend="' ' + ${task.priorityClass}" th:text="${task.priorityLabel}">中</span></td>
                <td><span th:classappend="${task.overdue} ? 'overdue'" th:text="${task.dueDateText}">-</span></td>
                <td><span class="badge status" th:classappend="${task.status.name()}" th:text="${task.status.label}">状态</span></td>
                <td class="row-actions">
                    <a class="btn ghost" th:href="@{/pm/tasks/{id}/edit(id=${task.id})}" title="编辑任务">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                        编辑
                    </a>
                    <form th:action="@{/pm/tasks/{id}/delete(id=${task.id})}" method="post"
                          th:onsubmit="return confirm('确认删除任务「' + ${task.title} + '」吗？');">
                        <button class="btn ghost danger" type="submit" title="删除任务">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            删除
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tasks)}">
                <td colspan="6" class="empty">没有符合条件的任务，点击右上角「新建任务」创建第一个</td>
            </tr>
            </tbody>
        </table>
        <div th:replace="~{fragments/layout :: pagination}"></div>
    </section>
</main>
</body>
</html>
