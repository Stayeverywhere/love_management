<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('我的任务')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="wrap">
    <section class="card">
        <div class="page-head">
            <div>
                <h1>我的任务</h1>
                <p class="sub">查看分配给自己的任务，可按状态筛选。</p>
            </div>
        </div>
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="filter-bar">
            <a class="filter" th:classappend="${selected == ''} ? 'active'" th:href="@{/tasks}">全部</a>
            <a class="filter" th:classappend="${selected == 'TODO'} ? 'active'" th:href="@{/tasks(status=TODO)}">待处理</a>
            <a class="filter" th:classappend="${selected == 'IN_PROGRESS'} ? 'active'" th:href="@{/tasks(status=IN_PROGRESS)}">进行中</a>
            <a class="filter" th:classappend="${selected == 'DONE'} ? 'active'" th:href="@{/tasks(status=DONE)}">已完成</a>
        </div>
        <table>
            <thead>
            <tr>
                <th>任务</th>
                <th>负责人</th>
                <th>优先级</th>
                <th>截止日期</th>
                <th>状态</th>
                <th class="th-actions">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}">
                <td>
                    <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}" class="link">标题</a>
                </td>
                <td th:text="${task.assignee != null} ? ${task.assignee.name} : '未分配'">-</td>
                <td><span class="badge" th:classappend="' ' + ${task.priorityClass}" th:text="${task.priorityLabel}">中</span></td>
                <td><span th:classappend="${task.overdue} ? 'overdue'" th:text="${task.dueDateText}">-</span></td>
                <td><span class="badge status" th:classappend="${task.status.name()}" th:text="${task.status.label}">状态</span></td>
                <td class="row-actions">
                    <a class="btn ghost" th:href="@{/tasks/{id}(id=${task.id})}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        查看
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tasks)}">
                <td colspan="6" class="empty">没有符合条件的任务</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
